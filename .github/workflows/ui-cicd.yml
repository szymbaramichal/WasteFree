name: Build and Deploy UI Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: cd UI && npm ci

      - name: Build UI
        run: cd UI && npm run build --if-present

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }} --suffix ${{ secrets.AZURE_ACR_SUFFIX }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.AZURE_ACR_NAME }}-${{ secrets.AZURE_ACR_SUFFIX }}.azurecr.io/wastefree-ui:${{ github.sha }} -f UI/Dockerfile UI

      - name: Push Docker image to ACR
        run: |
          docker push \
            ${{ secrets.AZURE_ACR_NAME }}-${{ secrets.AZURE_ACR_SUFFIX }}.azurecr.io/wastefree-ui:${{ github.sha }}
